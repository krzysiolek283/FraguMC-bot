<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FraguMC-bot — panel</title>
<style>
:root{--bg:#0d0f14;--card:#161a23;--border:#262c3a;--accent:#7c5cff;--accent2:#9d7bff;
--text:#e8eaf0;--muted:#9aa3b2;--green:#3ddc84;--red:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:#10131a;border-right:1px solid var(--border);padding:20px 14px;flex-shrink:0}
aside h1{font-size:18px;margin-bottom:4px}
aside h1 span{color:var(--accent2)}
aside p{font-size:12px;color:var(--muted);margin-bottom:20px}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:4px;cursor:pointer}
nav a:hover,nav a.active{background:#1e2330;color:var(--text)}
main{flex:1;padding:28px;max-width:760px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.dot.on{background:var(--green)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input,select{width:100%;background:#0f1320;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 10px;margin-top:4px;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);border:none;border-radius:8px;color:#fff;padding:9px 16px;margin:12px 8px 0 0;font-size:14px;cursor:pointer}
button:hover{background:var(--accent2)}
button.ghost{background:#232938}
button.danger{background:#3a1d22;color:#ff8f8f}
pre{background:#0b0e13;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto}
#msg{font-size:14px;margin-bottom:6px;min-height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){body{flex-direction:column}aside{width:100%}main{padding:16px}.grid2{grid-template-columns:1fr}}
</style></head><body>
<aside>
<h1>FraguMC <span>panel</span></h1>
<p>Konfiguracja bota Discord</p>
<nav>
<a data-t="sec-conn" class="active">🔌 Połączenie</a>
<a data-t="sec-srv">🖥️ Serwer Discord</a>
<a data-t="sec-mc">⛏️ Minecraft</a>
<a data-t="sec-kary">🚫 Kanał kar</a>
<a data-t="sec-prop">💡 Propozycje</a>
</nav></aside>
<main>
<div class="topbar"><div class="dot" id="dot"></div><span id="msg">Nie połączono</span></div>

<section class="card" id="sec-conn"><h3>🔌 Połączenie z botem</h3>
<div class="grid2">
<label>Host<input id="host" value="fi15.bot-hosting.net"></label>
<label>Port<input id="port" value="26269"></label>
</div>
<label>Klucz API<input id="key" type="password" placeholder="wklej API_KEY"></label>
<button onclick="connect()">Połącz</button></section>

<section class="card" id="sec-srv"><h3>🖥️ Serwer Discord</h3>
<label>Wybierz serwer<select id="guild"></select></label></section>

<section class="card" id="sec-mc"><h3>⛏️ Serwer Minecraft</h3>
<label>Adres (IP / domena)<input id="mc_addr"></label>
<label>Nazwa<input id="mc_name"></label>
<button onclick="saveServer()">Zapisz</button>
<button class="danger" onclick="delServer()">Usuń</button>
<button class="ghost" onclick="checkStatus()">Sprawdź status</button>
<pre id="mcstatus">—</pre></section>

<section class="card" id="sec-kary"><h3>🚫 Kanał kar</h3>
<label>Kanał<select id="kary"></select></label>
<button onclick="saveKary()">Zapisz kanał kar</button></section>

<section class="card" id="sec-prop"><h3>💡 Kanały propozycji</h3>
<label>Aktywne kanały</label><pre id="proplist">—</pre>
<label>Kanał<select id="propchan"></select></label>
<button onclick="propAdd()">Dodaj</button>
<button class="danger" onclick="propDel()">Usuń</button></section>
</main>

<script>
let channels=[];
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  document.getElementById(a.dataset.t).scrollIntoView({behavior:'smooth'});
});
function base(){return `http://${document.getElementById('host').value.trim()}:${document.getElementById('port').value.trim()}`;}
function hdrs(){return {'Content-Type':'application/json','X-API-Key':document.getElementById('key').value.trim()};}
async function jget(p){const r=await fetch(base()+p,{headers:hdrs()});return r.json();}
async function jpost(p,b){const r=await fetch(base()+p,{method:'POST',headers:hdrs(),body:JSON.stringify(b)});return r.json();}
function say(t,ok){const m=document.getElementById('msg');m.textContent=t;m.style.color=ok===false?'var(--red)':'var(--green)';
  document.getElementById('dot').classList.toggle('on',ok!==false&&t!=='Nie połączono');}
function gid(){return document.getElementById('guild').value;}
function cname(id){const c=channels.find(x=>String(x.id)===String(id));return c?'#'+c.name:id;}

async function connect(){
  let ov;
  try{ov=await jget('/overview');}
  catch(e){say('Błąd połączenia — sprawdź host/port i czy bot działa.',false);return;}
  if(!ov.ok){say('Błąd: '+(ov.error||'zły klucz?'),false);return;}
  say('Połączono ✓');
  document.getElementById('guild').innerHTML=ov.guilds.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  if(ov.mc_server&&ov.mc_server.address){
    document.getElementById('mc_addr').value=ov.mc_server.address||'';
    document.getElementById('mc_name').value=ov.mc_server.name||'';
  }
  await loadGuild();
}
async function loadGuild(){
  const ch=await jget('/channels?guild_id='+gid());
  if(!ch.ok){say('Błąd kanałów: '+ch.error,false);return;}
  channels=ch.channels;
  const opts=channels.map(c=>`<option value="${c.id}">#${c.name}</option>`).join('');
  document.getElementById('kary').innerHTML=opts;
  document.getElementById('propchan').innerHTML=opts;
  const ov=await jget('/overview');
  const cfg=(ov.config||{})[gid()]||{};
  if(cfg.kary_channel)document.getElementById('kary').value=String(cfg.kary_channel);
  const propIds=(cfg.propozycje||[]).map(String);
  document.getElementById('proplist').textContent=propIds.length?propIds.map(cname).join(', '):'(brak)';
}
async function saveServer(){
  const r=await jpost('/server',{address:document.getElementById('mc_addr').value,name:document.getElementById('mc_name').value});
  say(r.ok?`Zapisano: ${r.name} (${r.address}, ${r.type})`:'Błąd: '+r.error,r.ok);
}
async function delServer(){
  if(!confirm('Usunąć serwer?'))return;
  const r=await fetch(base()+'/server',{method:'DELETE',headers:hdrs()}).then(x=>x.json());
  say(r.ok?'Usunięto':'Błąd: '+r.error,r.ok);
}
async function checkStatus(){
  const r=await jget('/mcstatus');
  document.getElementById('mcstatus').textContent=JSON.stringify(r,null,1);
}
async function saveKary(){
  const r=await jpost('/kary',{guild_id:gid(),channel_id:document.getElementById('kary').value});
  say(r.ok?'Zapisano kanał kar':'Błąd: '+r.error,r.ok);
}
async function propAdd(){
  const r=await jpost('/propozycje',{guild_id:gid(),channel_id:document.getElementById('propchan').value,action:'add'});
  if(r.ok)loadGuild();else say('Błąd: '+r.error,false);
}
async function propDel(){
  const r=await jpost('/propozycje',{guild_id:gid(),channel_id:document.getElementById('propchan').value,action:'remove'});
  if(r.ok)loadGuild();else say('Błąd: '+r.error,false);
}
document.getElementById('guild').addEventListener('change',loadGuild);
</script></body></html>
